name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "stan/**", "requirements*.txt", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Installed versions
        run: |
          { echo '### Installed versions'; echo '```'; pip freeze; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Tests
        run: pytest -q
      - name: Workflow files parse
        run: python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('ok')"

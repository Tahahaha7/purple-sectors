name: Update model

on:
  schedule:
    - cron: "0 6 * * 0"   # Sunday 06:00 UTC: the morning after qualifying
    - cron: "0 6 * * 1"   # Monday 06:00 UTC: retry in case timing data was late
  workflow_dispatch:
    inputs:
      force:
        description: "Refit even if there is no new data"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-model
  cancel-in-progress: false

env:
  YEAR: "2026"            # the season on the site; the model also uses every season from FIRST_YEAR
  FIRST_YEAR: "2023"      # OpenF1 lap data starts here
  CMDSTAN_VERSION: "2.36.0"
  PYTHONPATH: src

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

      - name: Restore OpenF1 cache
        uses: actions/cache@v5
        with:
          path: data/raw/openf1_cache
          key: openf1-${{ github.run_id }}
          restore-keys: openf1-

      - name: Fetch qualifying sessions (older seasons come from the cache)
        run: |
          for y in $(seq "$FIRST_YEAR" "$YEAR"); do
            python -m purple_sectors.fetch --year "$y" --strict
          done

      - name: Check for new data
        id: changes
        run: |
          if git diff --quiet -- "data/raw/quali_laps_${YEAR}.csv" && [ "${{ inputs.force }}" != "true" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "No new sessions: skipping the fit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore CmdStan
        if: steps.changes.outputs.new == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}

      - name: Install CmdStan
        if: steps.changes.outputs.new == 'true'
        run: python -c "import cmdstanpy; cmdstanpy.install_cmdstan(version='${CMDSTAN_VERSION}', cores=4)"

      - name: Fit the pace model
        if: steps.changes.outputs.new == 'true'
        run: >
          python -m purple_sectors.pace.fit --years $(seq "$FIRST_YEAR" "$YEAR") --out posterior_pace.npz
          --report fit_report.json --retry

      - name: Upload posterior
        if: always() && steps.changes.outputs.new == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: posterior-pace-run-${{ github.run_number }}
          path: |
            posterior_pace.npz
            fit_report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Export website data
        if: steps.changes.outputs.new == 'true'
        run: >
          python -m purple_sectors.pace.export --posterior posterior_pace.npz --laps "data/raw/quali_laps_${YEAR}.csv"
          --out site/data --snapshot-dir site/data/snapshots

      - name: Commit and push
        if: steps.changes.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/quali_laps_*.csv data/raw/schedule_*.json site/data
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Update model: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do                           # another job may have committed meanwhile:
            if git pull --rebase -X theirs origin main \
               && python -m purple_sectors.pace.export --index-only site/data/snapshots --laps "data/raw/quali_laps_${YEAR}.csv" \
               && git add site/data && git commit --amend --no-edit --allow-empty \
               && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

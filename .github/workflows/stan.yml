name: Stan models

# Compile every Stan model whenever one changes, so a syntax error can never reach the weekly fit.
on:
  pull_request:
    paths: ["stan/**", ".github/workflows/stan.yml"]
  push:
    branches: [main]
    paths: ["stan/**"]

permissions:
  contents: read

env:
  CMDSTAN_VERSION: "2.36.0"

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore CmdStan
        uses: actions/cache@v5
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}
      - name: Install CmdStan if the cache missed
        run: python -c "import cmdstanpy; cmdstanpy.install_cmdstan(version='${CMDSTAN_VERSION}', cores=4)"
      - name: Compile all models
        run: |
          python - << 'PY'
          import glob
          from cmdstanpy import CmdStanModel
          for f in sorted(glob.glob("stan/*.stan")):
              CmdStanModel(stan_file=f); print("compiled", f)
          PY

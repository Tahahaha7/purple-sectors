name: History

# One-off (re-run if an earlier season's results are corrected): earlier qualifying results
# from Jolpica and the teammate network that links every driver on the 2026 grid.
on:
  workflow_dispatch:
    inputs:
      first: { description: "First season", default: "2022" }
      last: { description: "Last season", default: "2025" }

permissions:
  contents: write

concurrency:
  group: update-model
  cancel-in-progress: false

env:
  PYTHONPATH: src

jobs:
  history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fetch results and build the network
        run: python -m purple_sectors.history --from "${{ inputs.first }}" --to "${{ inputs.last }}"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/history_quali_*.csv site/data/network.json
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "History ${{ inputs.first }}-${{ inputs.last }} and teammate network"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((attempt * 10))
          done
          exit 1

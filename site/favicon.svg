        fill="none" stroke="#9461FF" stroke-width="6.5" stroke-linejoin="round"/>
  <g fill="none" stroke-width="6.5" stroke-linejoin="round">
    <path d="M24 15 H45 C55 15 58 26 51 31" stroke="#C4A8FF"/>
    <path d="M51 31 L39 37.5 C33.5 40.5 34 48.5 26 49" stroke="#9461FF"/>
    <path d="M26 49 H17.5 C9 49 6 40.5 8 32 C9.8 24 13 15 24 15" stroke="#6E2BF2"/>
  </g>
  <!-- start / finish line, where sector 3 hands over to sector 1 -->
